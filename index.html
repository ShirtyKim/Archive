<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김셜티 아카이브</title>
<meta name="description" content="게임 기획자 지망생 김셜티의 프로토타입 모음">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --card-hover: #1c2029;
    --line: #2a2f39;
    --fg: #e9ebef;
    --mute: #8d94a0;
    --acc: #f2c14e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.6 "Pretendard", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 72px 20px 56px; }

  header { margin-bottom: 48px; }
  .eyebrow { color: var(--acc); font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  h1 { font-size: clamp(32px, 6vw, 48px); line-height: 1.15; margin: 8px 0 12px; letter-spacing: -.02em; }
  .intro { color: var(--mute); max-width: 520px; margin: 0; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card {
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px; color: inherit; text-decoration: none;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .card:hover { background: var(--card-hover); border-color: var(--acc); transform: translateY(-2px); }
  .card:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; }
  .num { color: var(--mute); font-size: 12px; font-variant-numeric: tabular-nums; }
  .card h2 { font-size: 20px; margin: 6px 0 8px; letter-spacing: -.01em; }
  .card p { color: var(--mute); margin: 0 0 18px; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .tag { font-size: 12px; color: var(--fg); background: #232833; border-radius: 999px; padding: 3px 10px; }
  .go { color: var(--acc); font-weight: 600; font-size: 14px; }
  .go::after { content: " →"; }

  footer { margin-top: 56px; color: var(--mute); font-size: 13px; border-top: 1px solid var(--line); padding-top: 20px; }
  footer a { color: var(--mute); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Prototype Archive</div>
    <h1>김셜티 아카이브</h1>
    <p class="intro">기획한 내용을 직접 만져 볼 수 있게 만든 프로토타입 모음이다. 카드를 누르면 바로 플레이할 수 있다.</p>
  </header>

  <main class="grid">
    <a class="card" href="project-mio/">
      <span class="num">01</span>
      <h2>Project Mio</h2>
      <p>손패의 병사를 내고, 속도로 겨루는 나무판 위의 전쟁.</p>
      <div class="tags"><span class="tag">카드 배틀</span><span class="tag">HTML</span></div>
      <span class="go">플레이</span>
    </a>

    <a class="card" href="valorant-greybox/">
      <span class="num">02</span>
      <h2>발로란트 신규 맵 그레이박스</h2>
      <p>신규 맵 레벨 디자인을 3D 그레이박스로 확인한다. 공격·수비 스폰에서 직접 걸어 볼 수 있다.</p>
      <div class="tags"><span class="tag">레벨 디자인</span><span class="tag">3D</span><span class="tag">FPS</span></div>
      <span class="go">플레이</span>
    </a>
  </main>

  <footer>
    <a href="https://github.com/ShirtyKim/Archive">GitHub</a>
  </footer>
</div>
</body>
</html>
